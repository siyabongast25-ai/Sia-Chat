<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0f172a;color:#fff;font-family:Arial;margin:0}.top{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center}.contact{background:#1e293b;padding:14px;border-bottom:1px solid #334155;cursor:pointer}.contact:hover{background:#334155}.chat{background:#0f172a;height:45vh;overflow:auto;padding:12px}.msg{margin:8px 0;padding:10px;background:#334155;border-radius:12px}.bar{display:flex;gap:8px;padding:10px;background:#1e293b;position:fixed;bottom:0;width:100%;box-sizing:border-box}input{padding:12px;width:70%;border-radius:20px;border:0;background:#0f172a;color:#fff}button{background:#14b8a6;color:#fff;padding:12px 16px;border:0;border-radius:20px;font-weight:bold}#login{text-align:center;padding:40px}</style></head><body><div id="login"><h1>Sia-Chat v3</h1><p>Tap contact to chat!</p><input id="name" placeholder="Your Name"><br><br><button onclick="go()">START</button></div><div id="app" style="display:none"><div class="top"><b id="hi"></b><button onclick="addContact()">+ Add</button></div><div id="contacts"></div><div class="chat" id="msgs"></div><div class="bar"><input id="text" placeholder="Type message..."><button onclick="send()">Send</button></div></div><script>let contacts=JSON.parse(localStorage.getItem('sia-contacts')||'["Sia-Bot","Thabo","Lerato"]');let current=contacts[0];function go(){let n=document.getElementById('name').value;if(!n){alert('Enter name');return;}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('hi').innerText='Hi '+n;render();open(current);}function render(){let h='';contacts.forEach(function(c){h+='<div class="contact" onclick="open(\''+c+'\')">'+c+' ➤</div>';});document.getElementById('contacts').innerHTML=h;}function open(name){current=name;document.getElementById('msgs').innerHTML='';add('System','Chat with '+name);}function add(w,t){let d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+w+':</b> '+t;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=9999;}function send(){let i=document.getElementById('text');if(!i.value)return;add('You',i.value);let v=i.value;i.value='';setTimeout(function(){add(current,'Reply to: '+v+' 👍')},700);}function addContact(){let n=prompt('Contact name?');if(!n)return;contacts.push(n);localStorage.setItem('sia-contacts',JSON.stringify(contacts));render();}</script></body></html>
