<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Arial;background:#111b21;color:#e9edef;height:100dvh;overflow:hidden}.hidden{display:none!important}#login{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b141a;color:#fff;padding:24px}#login input{padding:14px 18px;border-radius:24px;border:0;width:260px;margin-top:12px;text-align:center;background:#202c33;color:#fff;outline:0}#login button{margin-top:16px;background:#00a884;color:#111b21;padding:12px 36px;border:0;border-radius:24px;font-weight:700;font-size:16px} .app{height:100dvh;display:flex;flex-direction:column} .header{background:#202c33;padding:10px 14px;display:flex;align-items:center;gap:12px;color:#e9edef;flex-shrink:0} .header .back{font-size:22px;cursor:pointer;padding:6px 10px} .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex-shrink:0} .contacts{flex:1;overflow:auto;background:#111b21} .contact{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #222d34;cursor:pointer} .contact:hover{background:#202c33} .contact b{color:#e9edef} .contact small{color:#8696a0} .chat{flex:1;overflow:auto;padding:12px;background:#0b141a;background-image:url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");background-blend-mode:soft-light;background-color:#0b141a;opacity:1} .msg{max-width:78%;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14.5px;line-height:19px;box-shadow:0 1px .5px rgba(0,0,0,.5);white-space:pre-wrap;word-break:break-word} .me{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0} .bot{background:#202c33;color:#e9edef;margin-right:auto;border-top-left-radius:0} .bar{background:#202c33;padding:6px 8px;display:flex;gap:8px;align-items:center;flex-shrink:0} .bar input{flex:1;padding:12px 14px;border-radius:21px;border:0;background:#2a3942;color:#fff;outline:0} .bar button{border:0;width:46px;height:46px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer} .sendBtn{background:#00a884;color:#111b21} .imgBtn{background:#2a3942;color:#8696a0} .chat img{max-width:100%;border-radius:8px;margin-top:6px}</style></head><body><div id="login"><h1 style="font-size:32px">Sia-Chat</h1><p style="color:#8696a0;margin-top:6px">Dark Mode • Real AI</p><input id="name" placeholder="Your Name"><button onclick="go()">Start</button></div><div id="app" class="app hidden"><div id="contactsView" style="flex:1;display:flex;flex-direction:column;overflow:hidden"><div class="header"><span style="flex:1;font-size:19px;font-weight:600" id="hi">Chats</span><button onclick="addContact()" style="background:#00a884;color:#111b21;border:0;padding:8px 14px;border-radius:20px;font-weight:600">+ New</button></div><div class="contacts" id="contacts"></div></div><div id="chatView" class="hidden" style="flex:1;display:flex;flex-direction:column;overflow:hidden"><div class="header"><span class="back" onclick="showContacts()">←</span><div class="avatar" id="chatAvatar"></div><div style="flex:1"><div id="chatName" style="font-size:16px;font-weight:600"></div><small id="chatStatus" style="color:#00a884;font-size:12px">online</small></div></div><div class="chat" id="msgs"></div><div class="bar"><button class="imgBtn" onclick="document.getElementById('pic').click()">📷</button><input id="pic" type="file" accept="image/*" class="hidden" onchange="sendPic(event)"><input id="text" placeholder="Type a message" onfocus="setTimeout(()=>{document.getElementById('msgs').scrollTop=999999},300)"><button class="sendBtn" onclick="send()">➤</button></div></div></div><script>let colors=["#00a884","#128c7e","#54656f","#6b7c8d","#d38a3a","#8b5cf6","#e65a4f","#0b5e4b"];let contacts=JSON.parse(localStorage.getItem('sia-contacts')||'["Sia-Bot","Thabo","Lerato","prudence"]');let current="";function colFor(n){let s=0;for(let i=0;i<n.length;i++)s+=n.charCodeAt(i);return colors[s%colors.length];}function avatarCircle(name){return `<div class="avatar" style="background:${colFor(name)}">${name.trim()[0].toUpperCase()}</div>`;}function go(){let n=document.getElementById('name').value.trim();if(!n){alert('Enter name');return;}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('hi').innerText=n;render();}function render(){let h="";contacts.forEach(function(c){h+=`<div class="contact" onclick="openChat('${c.replace(/'/g,"\\'")}')">${avatarCircle(c)}<div style="flex:1"><b>${c}</b><br><small>${c.includes('Sia-Bot')?'Real AI • online':'Hey there! I am using Sia-Chat'}</small></div><small style="color:#8696a0">›</small></div>`;});document.getElementById('contacts').innerHTML=h;}function showContacts(){document.getElementById('chatView').classList.add('hidden');document.getElementById('contactsView').classList.remove('hidden');}function openChat(name){current=name;document.getElementById('contactsView').classList.add('hidden');document.getElementById('chatView').classList.remove('hidden');document.getElementById('chatName').innerText=name;let av=document.getElementById('chatAvatar');av.style.background=colFor(name);av.innerText=name.trim()[0].toUpperCase();document.getElementById('chatStatus').innerText='online';document.getElementById('msgs').innerHTML='';if(name.includes('Sia-Bot'))addMsg('Sia-Bot','Dark mode on! 🌙 I am Real AI now. Ask anything! Keyboard is fixed too!',0);else addMsg(name,'',0,true);setTimeout(()=>{document.getElementById('text').focus();},100);}function addMsg(w,t,isMe,isFirst){let d=document.createElement('div');d.className='msg '+(isMe?'me':'bot');if(isFirst){d.innerHTML=`<small style="color:#8696a0">Start chat with ${w}</small>`;}else if(t.startsWith('<img')){d.innerHTML=w.includes('You')?t:`<b style="color:${colFor(w)};font-size:13px">${w}</b><br>`+t;}else{d.innerHTML=isMe?t:`<b style="color:${colFor(w)};font-size:13px">${w}</b><br>`+t;}document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=999999;}async function getRealAI(prompt){try{let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt+' - short friendly under 100 words'));let txt=await res.text();return txt.slice(0,500);}catch(e){return 'AI offline but I am here! 😊';}}async function send(){let i=document.getElementById('text');if(!i.value.trim())return;let v=i.value.trim();addMsg('You',v,1);i.value='';if(!current.includes('Sia-Bot')){document.getElementById('chatStatus').innerText='typing...';setTimeout(()=>{document.getElementById('chatStatus').innerText='online';addMsg(current,'Seen: '+v+' 👍',0)},1200);return;}let s=document.getElementById('chatStatus');s.innerText='typing...';let think=document.createElement('div');think.className='msg bot';think.id='think';think.innerText='Sia-Bot is typing...';document.getElementById('msgs').appendChild(think);let ans=await getRealAI(v);let th=document.getElementById('think');if(th)th.remove();s.innerText='online';addMsg('Sia-Bot',ans,0);}function sendPic(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(){let html=`<img src="${r.result}"><br><small>Photo</small>`;addMsg('You',html,1);if(current.includes('Sia-Bot')){setTimeout(()=>addMsg('Sia-Bot','Nice pic! 🔥 I can see it! Dark mode looks great right?',0),800);}else{setTimeout(()=>addMsg(current,'<img src="'+r.result+'"><br>Nice!',0),800);}};r.readAsDataURL(f);}function addContact(){let n=prompt('Contact name?');if(!n)return;contacts.push(n);localStorage.setItem('sia-contacts',JSON.stringify(contacts));render();}</script></body></html>
