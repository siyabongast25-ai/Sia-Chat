<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIA CHAT REAL</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column}#login{position:fixed;inset:0;background:#111b21;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}#login h1{color:#25D366;font-size:38px}#login input{width:100%;max-width:300px;padding:14px;border-radius:10px;border:none;background:#202c33;color:#fff;margin:10px 0}#login button{width:100%;max-width:300px;padding:14px;background:#25D366;border:none;border-radius:10px;font-weight:bold;font-size:16px}.top{background:#202c33;padding:12px;display:flex;justify-content:space-between}.tabs{display:flex;background:#202c33}.tabs button{flex:1;padding:12px;background:none;border:none;color:#8696a0;border-bottom:2px solid transparent}.tabs .active{color:#25D366;border-color:#25D366}.search{padding:10px}.search input{width:100%;padding:10px;border-radius:8px;border:none;background:#202c33;color:#fff}.list{flex:1;overflow-y:auto}.card{padding:12px;display:flex;gap:12px;border-bottom:1px solid #222}.card:hover{background:#202c33}.av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000}.chat{flex:1;display:flex;flex-direction:column;background:#0b141a}.msgs{flex:1;overflow-y:auto;padding:15px}.m{max-width:70%;padding:8px 12px;border-radius:8px;margin-bottom:8px}.me{background:#005c4b;margin-left:auto}.them{background:#202c33}.input{display:flex;padding:10px;background:#202c33;gap:8px}.input input{flex:1;padding:12px;border-radius:24px;border:none;background:#2a3942;color:#fff}.input button{background:#25D366;border:none;width:44px;height:44px;border-radius:50%}.hidden{display:none}</style></head><body>
<div id="login"><h1>SIA CHAT</h1><p style="color:#8696a0;margin:10px">Find friends & chat real!</p><input id="n" placeholder="Your Name"><input id="s" placeholder="Status (e.g. Available)"><button onclick="join()">START CHATTING 🚀</button></div>
<div class="top"><b>SIA <span style="color:#25D366">CHAT</span> <small id="me"></small></b><button onclick="share()" style="background:#25D366;border:none;padding:6px 12px;border-radius:20px;font-weight:bold">Share</button></div>
<div class="tabs"><button id="t1" class="active" onclick="tab('chats')">Chats</button><button id="t2" onclick="tab('people')">Find People</button></div>
<div class="search"><input id="q" placeholder="Search people..." oninput="render(this.value)"></div>
<div style="display:flex;flex:1;overflow:hidden"><div class="list" id="list"></div><div class="chat"><div class="msgs" id="msgs"></div><div class="input"><input id="msg" placeholder="Type..." onkeypress="if(event.key=='Enter')send()"><button onclick="send()">➤</button></div></div></div>
<script>
let U=JSON.parse(localStorage.getItem('sia_u')||'null'),users=JSON.parse(localStorage.getItem('sia_users')||'[]'),msgs=JSON.parse(localStorage.getItem('sia_msgs')||'[]'),cur={id:'global',name:'Sia-Chat Group',c:'#25D366'},ct='chats';
function col(){return ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9f45','#a66cff'][Math.floor(Math.random()*6)]}
window.join=()=>{let name=document.getElementById('n').value.trim();let st=document.getElementById('s').value.trim()||'Hey there! I am using Sia Chat';if(!name)return alert('Enter name');U={id:'u_'+Date.now(),name,status:st,color:col(),online:true};localStorage.setItem('sia_u',JSON.stringify(U));users=users.filter(x=>x.name!=name);users.push(U);if(users.length==1){users.push(...[{id:'mama',name:'Mama',status:'Oukay my child ❤️',color:'#ff6b6b',online:true},{id:'bestie',name:'Bestie',status:'That app is fire 🔥',color:'#ffd93d',online:true}]);}localStorage.setItem('sia_users',JSON.stringify(users));document.getElementById('login').classList.add('hidden');document.getElementById('me').innerText='• '+name;render();}
window.tab=t=>{ct=t;document.getElementById('t1').classList.toggle('active',t=='chats');document.getElementById('t2').classList.toggle('active',t=='people');render();}
window.render=f=>{f=(f||'').toLowerCase();let l=document.getElementById('list');l.innerHTML='';let arr=ct=='chats'?[{id:'global',name:'Sia-Chat Group',status:'Everyone here',color:'#25D366',online:true},...users.filter(u=>u.id!=U.id)]:users.filter(u=>u.id!=U.id);if(f)arr=arr.filter(u=>u.name.toLowerCase().includes(f));arr.forEach(u=>{let last=msgs.filter(m=>m.chat==u.id).slice(-1)[0];let d=document.createElement('div');d.className='card';d.innerHTML=`<div class=av style="background:${u.color}">${u.name[0]}</div><div style="flex:1"><b>${u.name} ${u.online?'🟢':''}</b><div style="font-size:13px;color:#8696a0">${last?last.text:u.status}</div></div>`;d.onclick=()=>{cur=u;load()};l.appendChild(d);});if(!arr.length)l.innerHTML='<div style="padding:20px;color:#8696a0;text-align:center">No people. Tap Share to invite!</div>';}
function load(){let b=document.getElementById('msgs');b.innerHTML='';msgs.filter(m=>m.chat==cur.id).forEach(m=>{let d=document.createElement('div');d.className='m '+(m.from==U.id?'me':'them');d.innerHTML=m.text+`<br><small style="font-size:11px;color:#8696a0">${new Date(m.t).toLocaleTimeString().slice(0,5)}</small>`;b.appendChild(d);});b.scrollTop=b.scrollHeight;}
window.send=()=>{let i=document.getElementById('msg');let t=i.value.trim();if(!t)return;msgs.push({chat:cur.id,text:t,from:U.id,t:Date.now()});localStorage.setItem('sia_msgs',JSON.stringify(msgs));i.value='';load();render(document.getElementById('q').value);if(cur.id=='mama'||cur.id=='bestie'){setTimeout(()=>{let r=cur.id=='mama'?['Proud of you my child ❤️','Wow you built WhatsApp!']:['This is fire bro 🔥','Add voice notes!'];msgs.push({chat:cur.id,text:r[Math.floor(Math.random()*r.length)],from:cur.id,t:Date.now()});localStorage.setItem('sia_msgs',JSON.stringify(msgs));load();},800);}}
window.share=()=>{let L='https://siyabongast25-ai.github.io/Sia-Chat/';navigator.clipboard.writeText(L);alert('Link copied! Share: '+L);}
if(U){document.getElementById('login').classList.add('hidden');document.getElementById('me').innerText='• '+U.name;render();load();}
</script></body></html>
