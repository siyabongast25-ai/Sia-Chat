<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0f172a;color:#fff;font-family:Arial;margin:0}.top{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center}.contact{padding:14px;border-bottom:1px solid #1e293b;cursor:pointer;background:#111c33}.chat{height:55vh;overflow:auto;padding:12px}.msg{margin:8px 0;padding:12px;border-radius:14px;max-width:85%}.me{background:#14b8a6;margin-left:auto}.bot{background:#334155}.bar{display:flex;gap:8px;padding:10px;background:#1e293b;position:fixed;bottom:0;width:100%;box-sizing:border-box}input{padding:12px;width:70%;border-radius:20px;border:0;background:#0f172a;color:#fff}button{background:#14b8a6;color:#fff;padding:12px 16px;border:0;border-radius:20px;font-weight:bold}#login{text-align:center;padding:40px}</style></head><body><div id="login"><h1>Sia-Chat v4</h1><p>Smart Bot now!</p><input id="name" placeholder="Your Name"><br><br><button onclick="go()">START</button></div><div id="app" style="display:none"><div class="top"><b id="hi"></b><button onclick="addContact()">+ Add</button></div><div id="contacts"></div><div class="chat" id="msgs"></div><div class="bar"><input id="text" placeholder="Ask anything..."><button onclick="send()">Send</button></div></div><script>let contacts=JSON.parse(localStorage.getItem('sia-contacts')||'["Sia-Bot","Thabo","Lerato","prudence"]');let current=contacts[0];function go(){let n=document.getElementById('name').value;if(!n){alert('Enter name');return;}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('hi').innerText='Hi '+n;render();open(current);}function render(){let h='';contacts.forEach(function(c){h+='<div class="contact" onclick="open(\''+c+'\')">'+c+' ➤</div>';});document.getElementById('contacts').innerHTML=h;}function open(name){current=name;document.getElementById('msgs').innerHTML='';if(name=='Sia-Bot')add('Sia-Bot','Hey! I am Sia-Bot 🤖 Ask me anything! Try: hi, how are you, joke, help, time, Bushbuckridge',0);else add('System','Chat with '+name,0);}function add(w,t,isMe){let d=document.createElement('div');d.className='msg '+(isMe?'me':'bot');d.innerHTML='<b>'+w+':</b> '+t;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=99999;}function smartReply(q){q=q.toLowerCase();if(q.includes('hi')||q.includes('hy')||q.includes('hello'))return 'Hey there! 👋 How can I help you today?';if(q.includes('how are you'))return 'I am good! Thanks for asking 😊 Built by you at 4AM! How are you?';if(q.includes('what now')||q.includes('what next'))return 'Now we make me smarter! You can: 1) Add more contacts with + Add 2) Chat with different people 3) Next we will add real AI and pictures!';if(q.includes('joke'))return 'Why did the phone go to school? Because it wanted to be smarter... like Sia-Chat! 😂';if(q.includes('help'))return 'I can chat! Try: hi, joke, time, who made you, Bushbuckridge';if(q.includes('time'))return 'Time is '+new Date().toLocaleTimeString()+' in Bushbuckridge ⏰';if(q.includes('who made')||q.includes('who created'))return 'You made me! Siyabonga Terry - the developer from Bushbuckridge! 🔥';if(q.includes('bushbuckridge'))return 'Bushbuckridge! Mpumalanga pride! 🌍 Sia-Chat was born there at 04:55 AM!';if(q.includes('thank'))return 'You are welcome! 🙏 Keep building!';return 'You said: "'+q+'". I am learning! 🤖 I am Sia-Bot v4 - smarter than before! Ask me: hi, joke, help, time';}function send(){let i=document.getElementById('text');if(!i.value)return;add('You',i.value,1);let v=i.value;i.value='';setTimeout(function(){if(current=='Sia-Bot')add('Sia-Bot',smartReply(v),0);else add(current,'Got it: '+v+' 👍 (from '+current+')',0);},600);}function addContact(){let n=prompt('Contact name?');if(!n)return;contacts.push(n);localStorage.setItem('sia-contacts',JSON.stringify(contacts));render();}</script></body></html>
