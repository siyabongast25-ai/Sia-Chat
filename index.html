<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sia-Chat v14 SMART</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff}.card{background:#1e293b;border-radius:20px;padding:20px;margin:14px}h1{text-align:center}input{width:100%;padding:14px;border-radius:12px;border:0;background:#334155;color:#fff;margin:8px 0;font-size:16px}button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;background:#14b8a6;color:#fff}.contact{background:#334155;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;cursor:pointer}.sia{background:linear-gradient(135deg,#14b8a6,#0ea5e9);border:2px solid #5eead4}#main,#chat{display:none}#welcome{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.chat-head{background:#1e293b;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0}.chat-head button{width:auto;background:#334155;padding:8px 14px;border-radius:20px}.msgs{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;height:calc(100vh - 110px);padding-bottom:80px}.bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4}.me{align-self:flex-end;background:#14b8a6}.them{align-self:flex-start;background:#334155}.inputRow{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#0f172a;max-width:480px;margin:0 auto}.inputRow input{margin:0;flex:1}.inputRow button{width:70px}.small{color:#94a3b8;font-size:12px;text-align:center;margin-top:8px}.thinking{font-style:italic;color:#5eead4}a{color:#5eead4}</style></head><body>
<div id="welcome"><div class="card" style="width:100%;max-width:400px"><h1>Sia-Chat v14 💬</h1><input id="nameInput" placeholder="Your name"><input id="locInput" value="Bushbuckridge - Mpumalanga"><button onclick="startApp()">START CHATTING</button><p class="small">v14 SMART Bot - Searches Wikipedia + AI!</p></div></div>
<div id="main"><div class="card"><h1>Sia-Chat 💬</h1><p class="small" id="hello" style="text-align:left"></p><div class="contact sia" onclick="openChat('Sia Bot','BOT')"><div><b>Sia Bot 🤖 SMART</b><br><span style="font-size:12px">Knows Mpumalanga, Google, everything!</span></div><span style="background:#000;padding:4px 8px;border-radius:10px;font-size:10px">SMART AI</span></div><button onclick="importContacts()">📱 Import All From Phone</button><button onclick="addManual()" style="background:#0ea5e9;margin-top:8px">➕ Add Manually</button><div id="contactList"></div><p class="small" id="status"></p><button onclick="resetApp()" style="background:#475569;margin-top:10px">Reset</button></div></div>
<div id="chat"><div class="chat-head"><button onclick="goBack()">← Back</button><div><b id="chatName"></b><br><span id="chatTel" style="font-size:11px;color:#94a3b8"></span></div></div><div class="msgs" id="msgs"></div><div class="inputRow"><input id="msgInput" placeholder="Ask anything... e.g. Where is Mpumalanga?"><button onclick="sendMessage()">Send</button></div></div>
<script>
var myName=localStorage.getItem('sia_name')||'';var currentName='';var currentTel='';
function $(id){return document.getElementById(id);}
function loadContacts(){try{return JSON.parse(localStorage.getItem('sia_contacts')||'[]')}catch(e){return []}}
function saveContacts(c){localStorage.setItem('sia_contacts',JSON.stringify(c));}
function loadAllMsgs(){try{return JSON.parse(localStorage.getItem('sia_msgs_v14')||'{}')}catch(e){return {}}}
function saveAllMsgs(m){localStorage.setItem('sia_msgs_v14',JSON.stringify(m));}
function startApp(){var n=$('nameInput').value.trim();if(!n)n='Siyabonga';myName=n;localStorage.setItem('sia_name',n);$('hello').innerText='Hi, '+n+'! Your SMART Bot is ready!';showMain();}
function showMain(){$('welcome').style.display='none';$('main').style.display='block';$('chat').style.display='none';renderContacts();}
function renderContacts(){var list=loadContacts();var html='';for(var i=0;i<list.length;i++){html+='<div class=contact onclick="openChat(\''+list[i].name.replace(/'/g,'')+'\',\''+list[i].tel+'\')"><div><b>'+list[i].name+'</b><br><span style="font-size:12px;color:#94a3b8">'+list[i].tel+'</span></div><span>💬</span></div>';}if(!list.length)html='<p class=small>No contacts yet. Import!</p>';$('contactList').innerHTML=html;$('status').innerText=list.length+' contacts';}
function openChat(name,tel){currentName=name;currentTel=tel;$('chatName').innerText=name;$('chatTel').innerText=(tel==='BOT'?'Sia SMART - Online Search Enabled':tel);$('welcome').style.display='none';$('main').style.display='none';$('chat').style.display='block';var all=loadAllMsgs();if(name==='Sia Bot'&&(!all[name]||all[name].length===0)){all[name]=[{from:'them',text:'Hey '+myName+'! 👋 I am Sia Bot v14 SMART!'},{from:'them',text:'Now I can SEARCH! Ask me "Where is Mpumalanga?" or "What is AI?" - I will search Wikipedia for real answers! 🔍'},{from:'them',text:'I also know you are in Bushbuckridge! Try me!'}];saveAllMsgs(all);}showMessages();}
function showMessages(){var all=loadAllMsgs();var msgs=all[currentName]||[];var out='';for(var i=0;i<msgs.length;i++){var cls=msgs[i].from==='me'?'me':'them';out+='<div class="bubble '+cls+'">'+msgs[i].text+'</div>';}$('msgs').innerHTML=out;setTimeout(function(){$('msgs').scrollTop=$('msgs').scrollHeight;},100);}
function sendMessage(){var input=$('msgInput');var txt=input.value.trim();if(!txt)return;var all=loadAllMsgs();if(!all[currentName])all[currentName]=[];all[currentName].push({from:'me',text:txt});saveAllMsgs(all);input.value='';showMessages();if(currentTel==='BOT'){setTimeout(function(){smartBotReply(txt);},500);}else{setTimeout(function(){var a=loadAllMsgs();a[currentName].push({from:'them',text:'(Saved offline) Will reply when online 💬'});saveAllMsgs(a);showMessages();},600);}}
async function smartBotReply(userText){var low=userText.toLowerCase();var all=loadAllMsgs();all[currentName].push({from:'them',text:'<span class=thinking>🔍 Searching for "'+userText+'"...</span>'});saveAllMsgs(all);showMessages();all=loadAllMsgs();all[currentName].pop();var reply='';if(low.includes('mpumalanga')){reply='📍 <b>Mpumalanga</b> is a province in <b>eastern South Africa!</b> 🇿🇦<br><br>• Capital: <b>Mbombela (Nelspruit)</b><br>• Next to Mozambique & Eswatini<br>• Famous for <b>Kruger National Park</b> 🦁<br>• Bushbuckridge is IN Mpumalanga! You are there! 😊<br>• Known for beautiful mountains & Blyde River Canyon<br><br>You are from Bushbuckridge, Mpumalanga - that is why your network is VodaCom-SA!';}else if(low.includes('bushbuckridge')){reply='📍 <b>Bushbuckridge</b> is in <b>Mpumalanga province, South Africa!</b><br><br>• Near Kruger National Park<br>• Part of Ehlanzeni District<br>• You live there! Vodacom-SA 4G! 😊';}else if(low.includes('limpopo')||low.includes('northam')){reply='📍 <b>Northam</b> is in <b>Limpopo province!</b> Limpopo is the northernmost province of South Africa, bordering Botswana, Zimbabwe & Mozambique. Northam is known for platinum mining!';}else if(low.includes('search with ai')||low.includes('what is ai')){reply='🤖 <b>AI = Artificial Intelligence</b><br><br>• I am AI! I learn from data to answer like a human<br>• Examples: ChatGPT, Meta AI, Sia Bot (me!)<br>• In Sia-Chat v14, I use SMART search + built-in knowledge<br>• Online mode: I search Wikipedia for real answers!<br><br>Try: "What is photosynthesis?" or "Who is Nelson Mandela?"';}else if(low.includes('where is')||low.includes('what is')||low.includes('who is')){try{var topic=userText.replace(/where is|what is|who is|where|what|who|\?/gi,'').trim();if(topic.length<2)topic=userText;var url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(topic);var resp=await fetch(url);if(resp.ok){var data=await resp.json();reply='🔍 <b>'+data.title+'</b><br><br>'+data.extract+'<br><br><a href="'+(data.content_urls?.desktop?.page||'https://en.wikipedia.org/wiki/'+encodeURIComponent(topic))+'" target="_blank">Read more on Wikipedia</a>';}else{var searchUrl='https://en.wikipedia.org/w/api.php?action=opensearch&search='+encodeURIComponent(topic)+'&limit=1&namespace=0&format=json&origin=*';var sResp=await fetch(searchUrl);if(sResp.ok){var sData=await sResp.json();if(sData[1]&&sData[1][0]){var title=sData[1][0];var sumUrl='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title);var sumResp=await fetch(sumUrl);if(sumResp.ok){var sumData=await sumResp.json();reply='🔍 <b>'+sumData.title+'</b><br><br>'+sumData.extract+'<br><br><a href="'+sumData.content_urls.desktop.page+'" target="_blank">Read more</a>';}else reply='Found: '+sData[1][0]+' - '+sData[2][0];}else throw 'no result';}else throw 'search fail';}}catch(e){reply='I tried searching online for "'+userText+'" but no internet or not found. 😅<br><br><b>Offline answer:</b> I know about Mpumalanga, Limpopo, Bushbuckridge, AI, and your contacts! Ask me those!';}}else if(low.includes('hi')||low.includes('hello')||low.includes('dumela')){reply='Dumela '+myName+'! 😊 I am SMART now! Ask me "Where is Mpumalanga?" again - I will give real answer now! 🔥';}else{reply='You said: "'+userText+'"<br><br>🤔 <b>SMART Bot v14 can:</b><br>• Where is Mpumalanga? → Real map answer<br>• What is AI? → Real explanation<br>• Who is Mandela? → Searches Wikipedia online!<br><br>Try asking something with Where/What/Who! You have data (Vodacom 4G) so online search will work! 🚀';}all=loadAllMsgs();all[currentName].push({from:'them',text:reply});saveAllMsgs(all);showMessages();}
function goBack(){showMain();}function addManual(){var n=prompt('Name:');if(!n)return;var t=prompt('Phone:')||'';var c=loadContacts();c.push({name:n,tel:t});saveContacts(c);renderContacts();}
async function importContacts(){var s=$('status');if(!(navigator.contacts&&window.ContactsManager)){s.innerText='Use Chrome';return;}try{s.innerText='Opening...';var contacts=await navigator.contacts.select(['name','tel'],{multiple:true});var existing=loadContacts();var added=0;for(var i=0;i<contacts.length;i++){var name=(contacts[i].name&&contacts[i].name[0])||'Unknown';var tel=(contacts[i].tel&&contacts[i].tel[0])||'';var found=false;for(var j=0;j<existing.length;j++){if(existing[j].name===name&&existing[j].tel===tel){found=true;break;}}if(!found){existing.push({name:name,tel:tel});added++;}}saveContacts(existing);renderContacts();s.innerText='Imported '+added+'! Total: '+existing.length;}catch(e){s.innerText='Cancelled';}}
function resetApp(){if(confirm('Clear all?')){localStorage.clear();location.reload();}}
$('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'){sendMessage();}});
$('nameInput').addEventListener('keydown',function(e){if(e.key==='Enter'){startApp();}});
(function(){if(myName){$('nameInput').value=myName;$('hello').innerText='Hi, '+myName+'!';showMain();}})();
</script></body></html>
