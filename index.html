<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0f172a;color:#fff;font-family:Arial;margin:0}
.top{background:#1e293b;padding:15px;display:flex;justify-content:space-between;align-items:center}
.left{width:35%;background:#1e293b;height:100vh;overflow:auto;border-right:1px solid #334155;float:left}
.right{width:65%;float:left}
.c{padding:12px;border-bottom:1px solid #334155;cursor:pointer;font-size:14px}
.c:hover{background:#334155}
input{padding:10px;width:68%;border-radius:8px;border:0;margin:5px}
button{background:#14b8a6;color:#fff;padding:10px 16px;border:0;border-radius:8px;font-weight:bold}
#msgs{height:60vh;overflow:auto;padding:12px;text-align:left}
.msg{margin:8px 0;padding:10px;background:#334155;border-radius:8px;font-size:14px}
#login{text-align:center;padding:30px}
</style>
</head>
<body>
<div id="login">
<h2>Sia-Chat v2 with Contacts</h2>
<p>Now with contacts list!</p>
<input id="name" placeholder="Your Name"><br><br>
<button onclick="go()">START</button>
</div>

<div id="app" style="display:none">
<div class="top"><b id="hi"></b><button onclick="addContact()">+ Add</button></div>
<div class="left" id="contacts"></div>
<div class="right">
<div id="msgs"></div>
<input id="text" placeholder="Type...">
<button onclick="send()">Send</button>
</div>
</div>

<script>
let contacts=JSON.parse(localStorage.getItem('sia-contacts')||'["Sia-Bot","Thabo - Acornhoek","Lerato - Bushbuckridge"]');
let current=contacts[0];
function go(){
let n=document.getElementById('name').value;
if(!n){alert('Enter name');return;}
login.style.display='none';
app.style.display='block';
hi.innerText='Hi '+n;
renderContacts();
openChat(current);
}
function renderContacts(){
let h='';
contacts.forEach(c=>{
h+='<div class=\"c\" onclick=\"openChat(\\''+c+'\\')\">'+c+'</div>';
});
document.getElementById('contacts').innerHTML=h;
}
function openChat(name){
current=name;
msgs.innerHTML='';
add('System','Chat with '+name);
}
function add(w,t){
let d=document.createElement('div');
d.className='msg';
d.innerHTML='<b>'+w+':</b> '+t;
msgs.appendChild(d);
}
function send(){
let i=document.getElementById('text');
if(!i.value)return;
add('You',i.value);
let v=i.value;
i.value='';
setTimeout(()=>add(current,'You said: '+v),600);
}
function addContact(){
let n=prompt('Contact name? e.g. Mom');
if(!n)return;
contacts.push(n);
localStorage.setItem('sia-contacts',JSON.stringify(contacts));
renderContacts();
}
</script>
</body>
  </html>
