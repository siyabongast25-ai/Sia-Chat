<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0f172a;color:#fff;font-family:Arial;margin:0}.top{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center}.contact{padding:14px;border-bottom:1px solid #1e293b;cursor:pointer;background:#111c33}.chat{height:50vh;overflow:auto;padding:12px}.msg{margin:8px 0;padding:12px;border-radius:14px;max-width:88%;white-space:pre-wrap}.me{background:#14b8a6;margin-left:auto}.bot{background:#334155}.bar{display:flex;gap:8px;padding:10px;background:#1e293b;position:fixed;bottom:0;width:100%;box-sizing:border-box}input{padding:12px;width:68%;border-radius:20px;border:0;background:#0f172a;color:#fff}button{background:#14b8a6;color:#fff;padding:12px 16px;border:0;border-radius:20px;font-weight:bold}#login{text-align:center;padding:30px}small{color:#94a3b8}</style></head><body><div id="login"><h1>Sia-Chat v6 🚀 REAL AI</h1><p>Real answers like Meta AI!</p><input id="name" placeholder="Your Name"><br><br><button onclick="go()">START CHAT</button><br><br><small>Built in Bushbuckridge ❤️</small></div><div id="app" style="display:none"><div class="top"><b id="hi"></b><button onclick="addContact()">+ Add</button></div><div id="contacts"></div><div class="chat" id="msgs"></div><div class="bar"><input id="text" placeholder="Ask anything - real AI!"><button onclick="send()">Send</button></div></div><script>let contacts=JSON.parse(localStorage.getItem('sia-contacts')||'["Sia-Bot 🤖 REAL AI","Thabo","Lerato","prudence"]');let current=contacts[0];let brain=JSON.parse(localStorage.getItem('sia-brain')||'{}');function go(){let n=document.getElementById('name').value;if(!n){alert('Enter name');return;}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('hi').innerText='Hi '+n;render();open(current);}function render(){let h='';contacts.forEach(function(c){h+='<div class="contact" onclick="open(\''+c.replace(/'/g,"\\'")+'\')">'+c+' ➤</div>';});document.getElementById('contacts').innerHTML=h;}function open(name){current=name;document.getElementById('msgs').innerHTML='';if(name.includes('Sia-Bot'))add('Sia-Bot','Hey! I am REAL AI now! 🚀 Ask me ANYTHING! Example: today is my mother birthday, write birthday message, help with homework, joke, anything!',0);else add('System','Chat with '+name,0);}function add(w,t,isMe){let d=document.createElement('div');d.className='msg '+(isMe?'me':'bot');d.innerHTML='<b>'+w+':</b> '+t;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=99999;}async function getRealAI(prompt){try{add('Sia-Bot','Thinking... 🤔',0);let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt+' - answer short, friendly, helpful. User is from Bushbuckridge SA.'));let txt=await res.text();document.querySelectorAll('.bot').forEach(e=>{if(e.innerText.includes('Thinking'))e.remove();});return txt.slice(0,600);}catch(e){document.querySelectorAll('.bot').forEach(el=>{if(el.innerText.includes('Thinking'))el.remove();});return 'Sorry, internet AI is offline 😅 But Happy Birthday to your mom! 🎂 Try: Tell me joke, What time is it, Who made you';}}async function send(){let i=document.getElementById('text');if(!i.value)return;let v=i.value.trim();add('You',v,1);i.value='';if(!current.includes('Sia-Bot')){setTimeout(()=>add(current,'Seen: '+v+' 👍',0),600);return;}let low=v.toLowerCase();if(low.includes('time')){add('Sia-Bot','Time: '+new Date().toLocaleTimeString()+' in Bushbuckridge ⏰',0);return;}if(low.includes('who made')){add('Sia-Bot','Siyabonga Terry made me in Bushbuckridge! You built Sia-Chat v6! 🔥❤️',0);return;}let answer=await getRealAI(v);add('Sia-Bot',answer,0);}function addContact(){let n=prompt('Contact name?');if(!n)return;contacts.push(n);localStorage.setItem('sia-contacts',JSON.stringify(contacts));render();}</script></body></html>
