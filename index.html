<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sia-Chat</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111b21;color:#fff;font-family:system-ui;display:flex;height:100vh;overflow:hidden}.side{width:100%;max-width:380px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}@media(max-width:700px){.side{position:absolute;inset:0;z-index:9;width:100%}.side.hide{transform:translateX(-100%)}}.top{background:#202c33;padding:14px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900}.logo span{color:#25D366}.search{padding:8px}.search input{width:100%;background:#202c33;border:0;border-radius:8px;padding:10px 14px;color:#fff;outline:none}.rows{flex:1;overflow-y:auto}.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #222d34;align-items:center}.row.active{background:#2a3942}.ava{width:48px;height:48px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;flex-shrink:0;background-size:cover;background-position:center}.main{flex:1;display:flex;flex-direction:column;background:#0b141a}.mtop{background:#202c33;padding:12px;display:flex;gap:12px;align-items:center}.msgs{flex:1;overflow-y:auto;padding:16px;background:#0b141a}.bub{max-width:75%;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}.me{background:#005c4b;margin-left:auto;border-top-right-radius:0}.them{background:#202c33;margin-right:auto;border-top-left-radius:0}.time{font-size:10px;color:#8696a0;text-align:right}.bar{background:#202c33;padding:8px 12px;display:flex;gap:8px}.bar input{flex:1;background:#2a3942;border:0;border-radius:20px;padding:12px 16px;color:#fff;outline:none}.send{width:44px;height:44px;background:#25D366;border-radius:50%;border:0}</style></head><body>
<div class="side" id="side"><div class="top"><div class="logo">SIA <span>CHAT</span> 💬</div><div>⚙️</div></div><div class="search"><input id="q" placeholder="Search chat" oninput="draw()"></div><div class="rows" id="rows"></div></div>
<div class="main"><div class="mtop"><span onclick="document.getElementById('side').classList.remove('hide')" style="font-size:22px">←</span><div class="ava" id="cAva" style="background:#25D366">S</div><div><div id="cName" style="font-weight:800">Tap a chat</div><div style="font-size:11px;color:#8696a0">online • your private WhatsApp</div></div></div><div class="msgs" id="msgs"><div style="text-align:center;color:#8696a0;margin-top:60px">👋 Welcome to Sia-Chat!<br>Your own WhatsApp by Siyabonga<br><br>📸 You can add pictures in chats!</div></div><div class="bar"><input id="inp" placeholder="Type a message" onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div></div>
<script>
let C=[{n:"Mama",l:"Oukay my child ❤️",a:"M",c:"#ff6b6b"},{n:"Bestie",l:"That app is fire 🔥",a:"B",c:"#feca57"},{n:"Sia-Chat Group",l:"Welcome to your own WhatsApp!",a:"S",c:"#25D366"},{n:"Cousin",l:"Send me link!",a:"C",c:"#1DB954"},{n:"You",l:"Building my app...",a:"Y",c:"#a29bfe"}];
let M=JSON.parse(localStorage.getItem('sia')||'{}');let cur=2;
function draw(){let q=document.getElementById('q').value.toLowerCase();let h='';C.forEach((x,i)=>{if(x.n.toLowerCase().includes(q)){let last=(M[i]&&M[i].slice(-1)[0]?.t)||x.l;h+=`<div class="row ${i==cur?'active':''}" onclick="openC(${i})"><div class="ava" style="background:${x.c}">${x.a}</div><div style="flex:1;overflow:hidden"><div style="display:flex;justify-content:space-between;font-weight:700">${x.n}<span style="font-size:11px;color:#8696a0">20:35</span></div><div style="font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last}</div></div></div>`}});document.getElementById('rows').innerHTML=h}
function openC(i){cur=i;document.getElementById('cName').textContent=C[i].n;document.getElementById('cAva').textContent=C[i].a;document.getElementById('cAva').style.background=C[i].c;draw();drawM();if(window.innerWidth<700)document.getElementById('side').classList.add('hide')}
function drawM(){let b=document.getElementById('msgs');let ms=M[cur]||[];if(!ms.length){b.innerHTML=`<div style="text-align:center;margin-top:30px"><span style="background:#182533;padding:8px 12px;border-radius:8px;color:#8696a0;font-size:12px">🔒 Chats saved on your phone - ${C[cur].n}</span></div>`;return}b.innerHTML='';ms.forEach(m=>{b.innerHTML+=`<div class="bub ${m.me?'me':'them'}">${m.t}<div class="time">${m.tm} ${m.me?'✓✓':''}</div></div>`});b.scrollTop=b.scrollHeight}
function send(){let i=document.getElementById('inp');let t=i.value.trim();if(!t)return;if(!M[cur])M[cur]=[];let tm=new Date();let tim=tm.getHours()+':'+String(tm.getMinutes()).padStart(2,'0');M[cur].push({t:t,me:true,tm:tim});localStorage.setItem('sia',JSON.stringify(M));i.value='';draw();drawM();setTimeout(()=>{let r=["Sharp! 🔥","Haha 😂","No cap fr","Bet bet","Slay!","Oukay 😎"];M[cur].push({t:r[Math.floor(Math.random()*r.length)],me:false,tm:tim});localStorage.setItem('sia',JSON.stringify(M));draw();drawM()},800)}
draw();drawM();
</script></body></html>
