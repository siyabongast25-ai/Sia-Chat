<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sia-Chat v13 Bot Fixed</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;min-height:100vh}.card{background:#1e293b;border-radius:20px;padding:20px;margin:14px}h1{text-align:center}input{width:100%;padding:14px;border-radius:12px;border:0;background:#334155;color:#fff;margin:8px 0;font-size:16px}button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;background:#14b8a6;color:#fff;cursor:pointer}.contact{background:#334155;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;cursor:pointer}.sia{background:linear-gradient(135deg,#14b8a6,#0ea5e9);border:2px solid #5eead4}#main,#chat{display:none}#welcome{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.chat-head{background:#1e293b;padding:12px;display:flex;gap:10px;align-items:center}.chat-head button{width:auto;background:#334155;padding:8px 14px;border-radius:20px}.msgs{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;height:calc(100vh - 110px);padding-bottom:80px}.bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:15px}.me{align-self:flex-end;background:#14b8a6;border-bottom-right-radius:4px}.them{align-self:flex-start;background:#334155;border-bottom-left-radius:4px}.inputRow{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#0f172a;max-width:480px;margin:0 auto}.inputRow input{margin:0;flex:1}.inputRow button{width:70px}.small{color:#94a3b8;font-size:12px;text-align:center;margin-top:8px}</style></head><body>
<div id="welcome"><div class="card" style="width:100%;max-width:400px"><h1>Sia-Chat v13 💬</h1><input id="nameInput" placeholder="Your name"><input id="locInput" value="Northam - Limpopo"><button onclick="startApp()">START CHATTING</button><p class="small">v13 Bot Fixed - Sia Bot will answer!</p></div></div>
<div id="main"><div class="card"><h1>Sia-Chat 💬</h1><p class="small" id="hello" style="text-align:left"></p><div class="contact sia" onclick="openChat('Sia Bot','BOT')"><div><b>Sia Bot 🤖</b><br><span style="font-size:12px">Tap to chat - I answer offline!</span></div><span style="background:#000;padding:4px 8px;border-radius:12px;font-size:10px">AI</span></div><button onclick="importContacts()">📱 Import All From Phone</button><button onclick="addManual()" style="background:#0ea5e9;margin-top:8px">➕ Add Manually</button><div id="contactList"></div><p class="small" id="status"></p><button onclick="resetApp()" style="background:#475569;margin-top:10px">Reset</button></div></div>
<div id="chat"><div class="chat-head"><button onclick="goBack()">← Back</button><div><b id="chatName"></b><br><span id="chatTel" style="font-size:11px;color:#94a3b8"></span></div></div><div class="msgs" id="msgs"></div><div class="inputRow"><input id="msgInput" placeholder="Type message..."><button onclick="sendMessage()">Send</button></div></div>
<script>
var myName=localStorage.getItem('sia_name')||'';var currentName='';var currentTel='';
function $(id){return document.getElementById(id);}
function loadContacts(){try{return JSON.parse(localStorage.getItem('sia_contacts')||'[]')}catch(e){return []}}
function saveContacts(c){localStorage.setItem('sia_contacts',JSON.stringify(c));}
function loadAllMsgs(){try{return JSON.parse(localStorage.getItem('sia_msgs')||'{}')}catch(e){return {}}}
function saveAllMsgs(m){localStorage.setItem('sia_msgs',JSON.stringify(m));}
function startApp(){var n=$('nameInput').value.trim();if(!n)n='Siyabonga';myName=n;localStorage.setItem('sia_name',n);$('hello').innerText='Hi, '+n+'! Tap Sia Bot to chat';showMain();}
function showMain(){$('welcome').style.display='none';$('main').style.display='block';$('chat').style.display='none';renderContacts();}
function renderContacts(){var list=loadContacts();var html='';for(var i=0;i<list.length;i++){html+='<div class=contact onclick="openChat(\''+list[i].name.replace(/'/g,'')+'\',\''+list[i].tel+'\')"><div><b>'+list[i].name+'</b><br><span style="font-size:12px;color:#94a3b8">'+list[i].tel+'</span></div><span>💬</span></div>';}if(!list.length)html='<p class=small>No contacts yet</p>';$('contactList').innerHTML=html;$('status').innerText=list.length+' contacts saved';}
function openChat(name,tel){currentName=name;currentTel=tel;$('chatName').innerText=name;$('chatTel').innerText=(tel==='BOT'?'Sia Bot - Always online (offline)':tel);$('welcome').style.display='none';$('main').style.display='none';$('chat').style.display='block';var all=loadAllMsgs();if(name==='Sia Bot'&&(!all[name]||all[name].length===0)){all[name]=[{from:'them',text:'Hey '+myName+'! 👋 I am Sia Bot!'},{from:'them',text:'I am fixed now! I WILL answer you! Try saying hi 😊'},{from:'them',text:'I work OFFLINE - no data needed. Ask me anything!'}];saveAllMsgs(all);}showMessages();}
function showMessages(){var all=loadAllMsgs();var msgs=all[currentName]||[];var out='';for(var i=0;i<msgs.length;i++){var cls=msgs[i].from==='me'?'me':'them';out+='<div class="bubble '+cls+'">'+msgs[i].text+'</div>';}$('msgs').innerHTML=out;setTimeout(function(){$('msgs').scrollTop=$('msgs').scrollHeight;},100);}
function sendMessage(){var input=$('msgInput');var txt=input.value.trim();if(!txt)return;var all=loadAllMsgs();if(!all[currentName])all[currentName]=[];all[currentName].push({from:'me',text:txt});saveAllMsgs(all);input.value='';showMessages();if(currentTel==='BOT'){setTimeout(function(){botReply(txt);},800);}else{setTimeout(function(){var a=loadAllMsgs();a[currentName].push({from:'them',text:'(Saved) Will reply when online 💬'});saveAllMsgs(a);showMessages();},800);}}
function botReply(userText){var low=userText.toLowerCase();var reply='';if(low.indexOf('hi')>-1||low.indexOf('hello')>-1||low.indexOf('hey')>-1||low.indexOf('dumela')>-1){reply='Dumela '+myName+'! 😊 I am working now! You said hi - sharp? How can I help?';}else if(low.indexOf('how are you')>-1){reply='I am great! I am finally talking! 🔥 Running offline in your phone. How are you?';}else if(low.indexOf('who are you')>-1){reply='I am Sia Bot 🤖 made for you in Northam! I live inside your Sia-Chat app. NO DATA needed!';}else if(low.indexOf('love')>-1||low.indexOf('babe')>-1){reply='Ayy 😏 love? Babe 🦋 from your contacts? Haha tell me more, secret safe!';}else if(low.indexOf('import')>-1){reply='You have '+loadContacts().length+' contacts. Tap Back, then Import!';}else if(low.indexOf('thank')>-1){reply='You are welcome '+myName+'! 🙏 Happy I can talk now! What next for Sia-Chat?';}else{reply='You said: "'+userText+'" - I hear you '+myName+'! 😊 Tell me more. I am here offline!';}var all=loadAllMsgs();all[currentName].push({from:'them',text:reply});saveAllMsgs(all);showMessages();}
function goBack(){showMain();}function addManual(){var n=prompt('Name:');if(!n)return;var t=prompt('Phone:')||'';var c=loadContacts();c.push({name:n,tel:t});saveContacts(c);renderContacts();}
async function importContacts(){var s=$('status');if(!(navigator.contacts&&window.ContactsManager)){s.innerText='Use Chrome Android';return;}try{s.innerText='Opening...';var contacts=await navigator.contacts.select(['name','tel'],{multiple:true});var existing=loadContacts();var added=0;for(var i=0;i<contacts.length;i++){var name=(contacts[i].name&&contacts[i].name[0])||'Unknown';var tel=(contacts[i].tel&&contacts[i].tel[0])||'';var found=false;for(var j=0;j<existing.length;j++){if(existing[j].name===name&&existing[j].tel===tel){found=true;break;}}if(!found){existing.push({name:name,tel:tel});added++;}}saveContacts(existing);renderContacts();s.innerText='Imported '+added+'! Total: '+existing.length;}catch(e){s.innerText='Cancelled';}}
function resetApp(){if(confirm('Clear all?')){localStorage.clear();location.reload();}}
$('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'){sendMessage();}});
$('nameInput').addEventListener('keydown',function(e){if(e.key==='Enter'){startApp();}});
(function(){if(myName){$('nameInput').value=myName;$('hello').innerText='Hi, '+myName+'!';showMain();}})();
</script></body></html>
