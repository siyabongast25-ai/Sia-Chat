<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sia-Chat v11 - Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;border-radius:20px;padding:28px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{font-size:28px;margin-bottom:14px;text-align:center}
input{width:100%;padding:14px 16px;border-radius:12px;border:0;background:#334155;color:#fff;font-size:16px;margin-bottom:12px;outline:none}
button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;font-size:16px;cursor:pointer}
.primary{background:#14b8a6;color:#fff}
.secondary{background:#0ea5e9;margin-top:10px}
.small{font-size:12px;color:#94a3b8;margin-top:10px;text-align:center}
#main{display:none;width:100%;max-width:480px}
.contact{background:#334155;padding:12px 14px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between}
.list{max-height:55vh;overflow:auto;margin-top:10px}
</style>
</head>
<body>
<div id="welcome" class="card">
<h1>Welcome to Sia-Chat</h1>
<input id="nameInput" placeholder="Your name e.g. Siyabonga">
<input id="locInput" placeholder="Northam - Limpopo" value="Northam - Limpopo">
<button class="primary" id="startBtn">START CHATTING</button>
<p class="small">Works offline! v11 Fixed</p>
<p class="small" id="err"></p>
</div>
<div id="main"><div class="card">
<h1 style="font-size:22px">Sia-Chat 💬</h1>
<p class="small" id="hello"></p>
<button class="primary" id="importBtn">📱 Import All From Phone</button>
<button class="secondary" id="addBtn" style="background:#0ea5e9">➕ Add Contact Manually</button>
<div class="list" id="contactList"></div>
<p class="small" id="status"></p>
<button style="background:#475569;margin-top:12px" id="resetBtn">Reset / Logout</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
const LS_KEY='sia_contacts_v11',NAME_KEY='sia_name_v11';
function loadContacts(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){return[]}}
function saveContacts(c){localStorage.setItem(LS_KEY,JSON.stringify(c))}
function render(){const list=$('contactList');const contacts=loadContacts();if(!contacts.length){list.innerHTML='<p class=small>No contacts yet. Tap Import above.</p>';return}list.innerHTML=contacts.map(c=>`<div class=contact><div><b>${c.name}</b><br><span style="font-size:12px;color:#94a3b8">${c.tel||''}</span></div></div>`).join('');$('status').textContent=contacts.length+' contacts saved'}
function showMain(name){$('welcome').style.display='none';$('main').style.display='block';$('hello').textContent='Hi, '+name+'!';render()}
(function(){const saved=localStorage.getItem(NAME_KEY);if(saved){$('nameInput').value=saved;showMain(saved)}})();
$('startBtn').addEventListener('click',()=>{const name=$('nameInput').value.trim();if(!name){$('err').textContent='Please type your name';return}localStorage.setItem(NAME_KEY,name);showMain(name)});
$('importBtn').addEventListener('click',async()=>{const s=$('status');if(!('contacts' in navigator&&'ContactsManager' in window)){s.textContent='Phone does not support direct import. Use Add Manually. Try Chrome Android.';return}try{s.textContent='Opening phone contacts...';const contacts=await navigator.contacts.select(['name','tel'],{multiple:true});if(!contacts.length){s.textContent='No contacts selected';return}let existing=loadContacts();let added=0;contacts.forEach(c=>{const name=(c.name&&c.name[0])||'Unknown';const tel=(c.tel&&c.tel[0])||'';if(!existing.find(e=>e.name===name&&e.tel===tel)){existing.push({name,tel});added++}});saveContacts(existing);render();s.textContent='✅ Imported '+added+' contacts! Total: '+existing.length}catch(err){$('status').textContent='Cancelled or blocked. Try again and Allow.'}});
$('addBtn').addEventListener('click',()=>{const n=prompt('Contact name:');if(!n)return;const t=prompt('Phone number (optional):')||'';let c=loadContacts();c.push({name:n,tel:t});saveContacts(c);render()});
$('resetBtn').addEventListener('click',()=>{if(confirm('Clear all?')){localStorage.removeItem(LS_KEY);localStorage.removeItem(NAME_KEY);location.reload()}});
</script>
</body>
  </html>
