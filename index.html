<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Arial;background:#efeae2} .hidden{display:none!important}#login{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b5e4b;color:#fff;padding:24px}#login input{padding:14px 18px;border-radius:24px;border:0;width:260px;margin-top:12px;text-align:center}#login button{margin-top:16px;background:#fff;color:#0b5e4b;padding:12px 36px;border:0;border-radius:24px;font-weight:700;font-size:16px} .app{height:100vh;display:flex;flex-direction:column;background:#fff} .header{background:#f0f2f5;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e9edef;color:#111b21;font-weight:600} .header .back{font-size:22px;cursor:pointer;padding:4px 8px} .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex-shrink:0} .contacts{flex:1;overflow:auto;background:#fff} .contact{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f0f2f5;cursor:pointer} .contact:hover{background:#f5f6f6} .contact b{color:#111b21} .contact small{color:#667781} .chat{flex:1;overflow:auto;padding:12px;background:#e5ddd5;background-image:url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");background-size:320px} .msg{max-width:78%;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14.5px;line-height:19px;box-shadow:0 1px .5px rgba(0,0,0,.13);white-space:pre-wrap} .me{background:#d9fdd3;margin-left:auto;border-top-right-radius:0} .bot{background:#fff;margin-right:auto;border-top-left-radius:0} .bar{background:#f0f2f5;padding:6px 8px;display:flex;gap:8px;align-items:center} .bar input{flex:1;padding:12px 14px;border-radius:21px;border:0;background:#fff;outline:0} .bar button{background:#0b5e4b;color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:20px} .top-title{flex:1}</style></head><body><div id="login"><h1 style="font-size:32px">Sia-Chat</h1><p style="opacity:.9;margin-top:6px">Your own chat</p><input id="name" placeholder="Your Name"><button onclick="go()">Start</button></div><div id="app" class="app hidden"><div id="contactsView" style="flex:1;display:flex;flex-direction:column"><div class="header"><span class="top-title" id="hi">Chats</span><button onclick="addContact()" style="background:#0b5e4b;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:600">+ New</button></div><div class="contacts" id="contacts"></div></div><div id="chatView" class="hidden" style="flex:1;display:flex;flex-direction:column"><div class="header"><span class="back" onclick="showContacts()">←</span><div class="avatar" id="chatAvatar"></div><div><div id="chatName" style="font-size:16px"></div><small id="chatStatus" style="color:#0b5e4b;font-weight:400">tap to view</small></div></div><div class="chat" id="msgs"></div><div class="bar"><input id="text" placeholder="Type a message"><button onclick="send()">➤</button></div></div></div><script>let colors=["#0b5e4b","#128c7e","#54656f","#6b7c8d","#d38a3a","#8b5cf6","#e65a4f"];let contacts=JSON.parse(localStorage.getItem('sia-contacts')||'["Sia-Bot","Thabo","Lerato","prudence"]');let current="";function colFor(n){let s=0;for(let i=0;i<n.length;i++)s+=n.charCodeAt(i);return colors[s%colors.length];}function avatarHTML(name,size){let c=colFor(name);let l=name.trim()[0].toUpperCase();return `<div class="avatar" style="background:${c};width:${size}px;height:${size}px">${l}</div>`;}function avatarCircle(name){let c=colFor(name);let l=name.trim()[0].toUpperCase();return `<div class="avatar" style="background:${c}">${l}</div>`;}function go(){let n=document.getElementById('name').value.trim();if(!n){alert('Enter name');return;}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('hi').innerText='Hi '+n;render();}function render(){let h="";contacts.forEach(function(c){h+=`<div class="contact" onclick="openChat('${c.replace(/'/g,"\\'")}')">${avatarCircle(c)}<div style="flex:1"><b>${c}</b><br><small>${c.includes('Sia-Bot')?'Real AI • tap to chat':'Hey there! I am using Sia-Chat'}</small></div><small>›</small></div>`;});document.getElementById('contacts').innerHTML=h;}function showContacts(){document.getElementById('chatView').classList.add('hidden');document.getElementById('contactsView').classList.remove('hidden');}function openChat(name){current=name;document.getElementById('contactsView').classList.add('hidden');document.getElementById('chatView').classList.remove('hidden');document.getElementById('chatName').innerText=name;document.getElementById('chatAvatar').style.background=colFor(name);document.getElementById('chatAvatar').innerText=name.trim()[0].toUpperCase();document.getElementById('msgs').innerHTML='';if(name.includes('Sia-Bot'))addMsg('Sia-Bot','Hi! I am Sia-Bot 🤖 Real AI now. Ask anything!',0);else addMsg(name,'',0,true);}function addMsg(w,t,isMe,isFirst){let d=document.createElement('div');d.className='msg '+(isMe?'me':'bot');if(isFirst){d.innerHTML=`<small style="color:#667781">Start chat with ${w}</small>`;}else{d.innerHTML=`${t}`;if(!isMe)d.innerHTML=`<b style="color:${colFor(w)};font-size:13px">${w}</b><br>`+t;}document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=99999;}async function getRealAI(prompt){try{let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt+' - answer short friendly under 120 words'));let txt=await res.text();return txt.slice(0,500);}catch(e){return 'AI offline, but I am here! 😊';}}async function send(){let i=document.getElementById('text');if(!i.value.trim())return;let v=i.value.trim();addMsg('You',v,1);i.value='';if(!current.includes('Sia-Bot')){setTimeout(()=>addMsg(current,'Seen: '+v,0),600);return;}let think=document.createElement('div');think.className='msg bot';think.innerText='typing...';document.getElementById('msgs').appendChild(think);let ans=await getRealAI(v);think.remove();addMsg('Sia-Bot',ans,0);}function addContact(){let n=prompt('Contact name?');if(!n)return;contacts.push(n);localStorage.setItem('sia-contacts',JSON.stringify(contacts));render();}</script></body></html>
